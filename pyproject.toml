[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "async-snowflake"
version = "0.2.1"
description = "Async Snowflake connector for Python with JWT authentication"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Snowflake Connector Team"}
]
keywords = ["snowflake", "database", "async", "connector", "jwt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "aiofiles>=25.1.0",
    "httpx>=0.28.1",
    "pydantic[email]>=2.12.5",
    "pyjwt>=2.11.0",
    "cryptography>=46.0.0",
    "tomli>=2.0.0",
    "ruff>=0.15.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
]
cli = [
    "typer>=0.23.1",
    "cryptography>=46.0.0",
    "tomli>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/Mridul98/async-snowflake-connector-python"
Documentation = "https://async-snowflake.readthedocs.io"
Repository = "https://github.com/Mridul98/async-snowflake-connector-python"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.hatch.build.targets.wheel]
packages = ["async_snowflake"]

[tool.hatch.envs.default]
skip-start = true
