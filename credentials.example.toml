# Snowflake Credentials Configuration
# Copy this file to credentials.toml and fill in your values
# DO NOT commit credentials.toml to version control

[default]
account = ""
user = ""
private_key_path = ""
region = "us-east-1"

# Example with multiple profiles:
# [production]
# account = "PROD_ACCOUNT"
# user = "admin"
# private_key_path = "/path/to/prod_key.pem"
# region = "us-west-1"

# [development]
# account = "DEV_ACCOUNT"
# user = "dev_user"
# private_key_path = "/path/to/dev_key.pem"
# region = "us-east-1"
